{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
!--the nav bar-->
    <div class="bg-gradient-to-r from bg-slate-700 to bg-slate-900 shadow py-2 fixed top-0 z-50 w-full">
        <nav class="max-w-6xl mx-auto flex justify-between px-2 ">
            <div class="flex items-center space-x-4 text-center">
                <!--logo-->
                <div>
                    <a href="{% url 'core' %}"><h2 class="text-fuchsia-500 font-medium font-bold bg-clip-text text-transparent bg-gradient-to-r from-fuchsia-500 to-fuchsia-700 text-2xl">
                        MovieMatrix</h2></a>
                </div>
                <!--nav links-->
                <div class="items-center">
                    <ul class="flex space-x-1 mt-1">
                        <li><a href="{% url 'core' %}" class="px-2 py-1 text-red-50 {% block home %} {% endblock %} rounded-2xl border-transparent transition-all duration 300 ease-in-out hover:bg-slate-800
                        cursor-pointer ">Home</a></li>
                        <li><a href="{% url 'movie' %}" class="px-2 py-1 text-red-50 {% block movie %} {% endblock %} border-2 rounded-2xl border-transparent transition-all duration 300 ease-in-out hover:bg-slate-800
                        cursor-pointer ">Movies</a></li>
                        <li><a href="{% url 'about' %}" class="px-2 py-1 text-red-50 {% block about %} {% endblock %} border-2 rounded-2xl border-transparent transition-all duration 300 ease-in-out hover:bg-slate-800
                        cursor-pointer max-sm:hidden ">About us</a></li>
                        <li><a href="{% url 'contact' %}" class="px-2 py-1 text-red-50 {% block contact %} {% endblock %} border-2 rounded-2xl border-transparent transition-all duration 300 ease-in-out hover:bg-slate-800
                        cursor-pointer max-sm:hidden ">Contact us</a></li>
                    </ul>
                </div>
            </div>

            <div class="space-x-2 max-md:hidden text-red-100 mt-1">
                <a href="#" class="px-2 py-1 text-red-50 border-2 rounded-2xl border-transparent transition-all duration 300 ease-in-out hover:bg-slate-800 ">Log in</a></li>
                <button class="bg-fuchsia-700 text-red-50 rounded-lg px-3 py-1 cursor-pointer transform transition font-semibold hover:bg-fuchsia-800 hover:-translate-x-1 ">Sign Up</button>
            </div>
        </nav>
    </div>

</body>
</html>
